<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interestelar Space • Buscaminas Espacial</title>
  <link rel="stylesheet" href="style.css?v=4.0">
</head>
<body>

  <div class="game-container">
    
    <!-- ENCABEZADO PRINCIPAL -->
    <header class="game-header">
      <h1>Interestelar Space</h1>
      <p>• Encuentra 🪐 Exoplanetas y evita el Agujero Negro</p>
    </header>

    <!-- COLUMNA IZQUIERDA: EL MAPA ESTELAR (5x5) -->
    <div class="star-map-wrapper">
      <div class="star-map" id="starMap">
        <!-- Las 25 celdas se generan dinámicamente desde tu script.js -->
      </div>
    </div>

    <!-- COLUMNA DERECHA: PANELES DE TELEMETRÍA Y CONTROL -->
    <div class="telemetry-sidebar">
      
      <!-- Panel de Exoplanetas -->
      <div class="panel-card">
        <h3>Exoplanetas</h3>
        <div class="panel-value" id="exoplanetCount">0 / 3 Encontrados</div>
      </div>

      <!-- Panel de Coordenadas -->
      <div class="panel-card">
        <h3>Coordenadas Actuales</h3>
        <div class="panel-value" id="currentCoords">[0][0]</div>
      </div>

      <!-- Panel de Análisis Científico -->
      <div class="panel-card scientific-analysis">
        <h3>Análisis Científico</h3>
        <p id="scientificText">✨ Cúmulo estelar: Región densa con protoestrellas jóvenes y alta emisión lumínica.</p>
      </div>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
