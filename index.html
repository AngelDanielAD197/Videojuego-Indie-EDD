<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interestelar Space</title>
    <link rel="stylesheet" href="style.css?v=9">
</head>
<body>

    <h1>Videojuego Indie 2D</h1>
    <div class="subtitle"> • Encuentra 🪐 Exoplanetas y evita el Agujero Negro</div>

    <div class="dashboard">
        <!-- Mapa de Sectores (Matriz 5x5) -->
        <div id="star-map"></div>

        <!-- Panel de Instrumentos -->
        <div class="control-panel">
            <div class="metric-box">
                <h3>Exoplanetas</h3>
                <div class="metric-value" id="score-val">0 / 3 Encontrados</div>
            </div>

            <div class="metric-box">
                <h3>Coordenadas Actuales</h3>
                <div class="metric-value" id="coords-val">[0][0]</div>
            </div>

            <!-- Pestaña de Análisis Científico vistosa y colorida -->
            <div class="metric-box science-box" id="science-container">
                <h3>Análisis Científico</h3>
                <div id="science-desc" class="science-text">Estación base inicial. Todo en orden.</div>
            </div>

            <div class="metric-box">
                <h3>Sucesos</h3>
                <div id="telemetry-log">> Sistema en línea. Inicie exploración.</div>
            </div>

            <button class="btn btn-scan" onclick="ejecutarEscaneoRadar2D()">📡 Escáner Radar de Peligro</button>
            <button class="btn" onclick="reiniciarJuego()">🔄 Reiniciar Misión</button>
        </div>
    </div>

    <!-- Controles Táctiles para Teléfono -->
    <div class="mobile-controls">
        <button class="d-btn" onclick="moverSonda(-1, 0)">⬆️</button>
        <div class="d-row">
            <button class="d-btn" onclick="moverSonda(0, -1)">⬅️</button>
            <button class="d-btn" onclick="moverSonda(1, 0)">⬇️</button>
            <button class="d-btn" onclick="moverSonda(0, 1)">➡️</button>
        </div>
    </div>

    <!-- Modal de Fin de Juego -->
    <div id="game-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="modal-title">¡Misión Terminada!</h2>
            <p id="modal-desc">Descripción...</p>
            <button class="btn" onclick="reiniciarJuego()">Nueva Partida</button>
        </div>
    </div>

    <script src="script.js?v=9"></script>
</body>
</html>
