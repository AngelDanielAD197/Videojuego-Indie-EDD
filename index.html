<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonda Astrofísica - Exploración 2D</title>
    <style>
        :root {
            --space-bg: #030712;
            --panel-bg: #0b1329;
            --cyan-neon: #00f0ff;
            --purple-neon: #a855f7;
            --amber-neon: #f59e0b;
            --text-main: #e2e8f0;
        }

        body {
            background-color: var(--space-bg);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        h1 {
            margin: 0 0 5px 0;
            color: var(--cyan-neon);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
            font-size: 24px;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .dashboard {
            display: flex;
            gap: 20px;
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #1e3a8a;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 240, 255, 0.05);
        }

        /* Matriz 5x5 Estelar */
        #star-map {
            display: grid;
            grid-template-columns: repeat(5, 75px);
            grid-template-rows: repeat(5, 75px);
            gap: 6px;
            background: #020617;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #1e293b;
        }

        .sector {
            width: 75px;
            height: 75px;
            background: #0f172a;
            border-radius: 6px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.2s ease;
            box-sizing: border-box;
            border: 1px solid #1e293b;
        }

        .sector .coords {
            position: absolute;
            top: 3px;
            left: 3px;
            font-size: 8px;
            color: #475569;
            font-weight: bold;
        }

        /* Tipos de Sector (Biomas cósmicos) */
        .vacio { background: #090d16; }
        .nebulosa { background: linear-gradient(135deg, #3b0764, #1e1b4b); border-color: #581c87; }
        .pulser { background: linear-gradient(135deg, #065f46, #022c22); border-color: #047857; }
        .asteroides { background: linear-gradient(135deg, #334155, #1e293b); border-color: #475569; }

        .explorado {
            border-color: #334155;
        }

        .no-explorado {
            background: #05050a !important;
            border-style: dashed;
            opacity: 0.4;
        }
        .no-explorado * { display: none; }
        .no-explorado::after { content: '🔒'; font-size: 14px; color: #334155; }

        /* Sonda del Jugador */
        .probe-here {
            border: 2px solid var(--cyan-neon) !important;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
            background: rgba(0, 240, 255, 0.1) !important;
        }

        .probe-icon {
            font-size: 26px;
            filter: drop-shadow(0 0 5px var(--cyan-neon));
            animation: float 2s infinite ease-in-out;
        }

        /* Panel de Control Lateral */
        .control-panel {
            width: 230px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .metric-box {
            background: #020617;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #1e293b;
            margin-bottom: 10px;
        }

        .metric-box h3 {
            margin: 0 0 5px 0;
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
        }

        .metric-value {
            font-size: 14px;
            font-weight: bold;
            color: var(--cyan-neon);
        }

        .btn {
            background: linear-gradient(90deg, #1d4ed8, #2563eb);
            border: none;
            color: white;
            padding: 10px;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 5px;
            text-transform: uppercase;
            font-size: 11px;
        }

        .btn:hover {
            background: linear-gradient(90deg, #2563eb, #3b82f6);
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.5);
        }

        .btn-scan {
            background: linear-gradient(90deg, #7c3aed, #a855f7);
        }

        .btn-scan:hover {
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }

        #telemetry-log {
            font-size: 10px;
            color: #94a3b8;
            height: 70px;
            overflow-y: auto;
            background: #020617;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #1e293b;
        }

        /* Efectos visuales para el algoritmo de búsqueda en 2D */
        .scanning {
            border: 2px solid var(--amber-neon) !important;
            background: rgba(245, 158, 11, 0.2) !important;
        }

        .signal-found {
            border: 2px solid var(--purple-neon) !important;
            box-shadow: 0 0 20px var(--purple-neon) !important;
            animation: pulse-signal 1s infinite alternate;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        @keyframes pulse-signal {
            from { transform: scale(1); }
            to { transform: scale(1.08); }
        }
    </style>
</head>
<body>

    <h1>Sonda Astrofísica 2D</h1>
    <div class="subtitle">Navegación por Matriz [5x5] • Usa <b>WASD</b> o <b>FLECHAS</b></div>

    <div class="dashboard">
        <!-- Mapa de Sectores (Matriz) -->
        <div id="star-map"></div>

        <!-- Panel de Instrumentos -->
        <div class="control-panel">
            <div>
                <div class="metric-box">
                    <h3>Coordenadas Matriz</h3>
                    <div class="metric-value" id="coords-val">[fila: 0][col: 0]</div>
                </div>

                <div class="metric-box">
                    <h3>Sector Actual</h3>
                    <div class="metric-value" id="sector-val">Vacío Cósmico</div>
                </div>

                <div class="metric-box">
                    <h3>Registro de Telemetría</h3>
                    <div id="telemetry-log">> Sistema en línea. Inicie exploración.</div>
                </div>
            </div>

            <button class="btn btn-scan" onclick="ejecutarBusqueda2D()">📡 Escanear Anomalía (Algoritmo 2D)</button>
            <button class="btn" onclick="reiniciarMision()">🔄 Reiniciar Mapa</button>
        </div>
    </div>

    <script>
        // 1. Definición de la matriz de 5x5 para el mapa estelar
        const FILAS = 5;
        const COLS = 5;

        // Matriz principal de biomas/tipos de sectores
        const mapaSectores = [
            ["vacio", "nebulosa", "vacio", "asteroides", "vacio"],
            ["vacio", "vacio", "asteroides", "nebulosa", "pulser"],
            ["nebulosa", "pulser", "vacio", "vacio", "asteroides"],
            ["asteroides", "vacio", "nebulosa", "nebulosa", "vacio"],
            ["vacio", "vacio", "vacio", "pulser", "vacio"]
        ];

        // Matriz secundaria de contenidos ocultos (Señales / Exoplanetas / Anomalías)
        const mapaAnomalias = [
            ["", "", "", "🪐 Exoplaneta", ""],
            ["", "", "", "", ""],
            ["", "✨ Pulsar Activo", "", "", ""],
            ["", "", "", "", ""],
            ["", "", "", "", "🚀 Nave Perdida"]
        ];

        // Matriz de visibilidad (Niebla estelar)
        let mapaRevelado = Array(FILAS).fill().map(() => Array(COLS).fill(false));

        // Posición inicial de la Sonda en la matriz [fila][columna]
        let sondaFila = 0;
        let sondaCol = 0;

        const iconosSector = {
            vacio: '🌌',
            nebulosa: '🟣',
            pulser: '🟢',
            asteroides: '🪨'
        };

        function logTelemetria(mensaje) {
            const box = document.getElementById('telemetry-log');
            box.innerHTML = `> ${mensaje}<br>` + box.innerHTML;
        }

        // Renderizar la matriz en el HTML de forma sistemática
        function renderizarMapa() {
            const contenedor = document.getElementById('star-map');
            contenedor.innerHTML = '';

            for (let fila = 0; fila < FILAS; fila++) {
                for (let col = 0; col < COLS; col++) {
                    const celda = document.createElement('div');
                    const esPosicionSonda = (fila === sondaFila && col === sondaCol);
                    const estaRevelado = mapaRevelado[fila][col];
                    const tipoSector = mapaSectores[fila][col]; // Acceso matriz[fila][columna]
                    const objetoOculto = mapaAnomalias[fila][col];

                    celda.id = `sector-${fila}-${col}`;
                    celda.className = `sector ${tipoSchClase(tipoSector)}`;

                    if (!estaRevelado && !esPosicionSonda) {
                        celda.classList.add('no-explorado');
                    }

                    if (esPosicionSonda) {
                        celda.classList.add('probe-here');
                    }

                    // Construcción interna de la celda con sus coordenadas de indexación
                    let contenidoHTML = `<span class="coords">[${fila}][${col}]</span>`;

                    if (esPosicionSonda) {
                        contenidoHTML += `<span class="probe-icon">🛰️</span>`;
                    } else if (estaRevelado) {
                        contenidoHTML += `<span>${objetoOculto !== "" ? '⭐' : iconosSector[tipoSector]}</span>`;
                    }

                    celda.innerHTML = contenidoHTML;
                    contenedor.appendChild(celda);
                }
            }

            // Actualizar datos de panel
            document.getElementById('coords-val').innerText = `[fila: ${sondaFila}][col: ${sondaCol}]`;
            document.getElementById('sector-val').innerText = mapaSectores[sondaFila][sondaCol].toUpperCase();
        }

        function tipoSchClase(tipo) {
            return tipo;
        }

        // Movimiento de la sonda respetando los límites de la matriz 5x5
        function moverSonda(df, dc) {
            let nuevaFila = sondaFila + df;
            let nuevaCol = sondaCol + dc;

            // Verificación de límites de la matriz bidimensional
            if (nuevaFila >= 0 && nuevaFila < FILAS && nuevaCol >= 0 && nuevaCol < COLS) {
                sondaFila = nuevaFila;
                sondaCol = nuevaCol;
                
                // Revelar sector actual
                mapaRevelado[sondaFila][sondaCol] = true;

                logTelemetria(`Salto a sector [${sondaFila}][${sondaCol}]`);
                renderizarMapa();

                // Detectar si hay algo oculto en esta coordenada
                if (mapaAnomalias[sondaFila][sondaCol] !== "") {
                    logTelemetria(`¡Anomalía detectada: ${mapaAnomalias[sondaFila][sondaCol]}!`);
                }
            } else {
                logTelemetria(`⚠️ Alerta: Límite del sector estelar alcanzado.`);
            }
        }

        // 2. Algoritmo de Búsqueda en 2D (Recorrido Sistemático con ciclos anidados)
        async function ejecutarBusqueda2D() {
            logTelemetria(`<b>Iniciando escaneo de largo alcance (Búsqueda 2D)...</b>`);
            let hallazgo = false;

            // Recorrido sistemático fila por fila, columna por columna
            for (let fila = 0; fila < FILAS; fila++) {
                for (let col = 0; col < COLS; col++) {
                    const celdaDOM = document.getElementById(`sector-${fila}-${col}`);
                    celdaDOM.classList.add('scanning');

                    // Pausa de animación para simular el procesamiento del escáner
                    await new Promise(resolve => setTimeout(resolve, 80));

                    // Comprobación de condición de búsqueda en la matriz secundaria
                    if (mapaAnomalias[fila][col] !== "") {
                        mapaRevelado[fila][col] = true;
                        renderizarMapa();
                        document.getElementById(`sector-${fila}-${col}`).classList.add('signal-found');
                        logTelemetria(`<b>¡Señal localizada en [${fila}][${col}] (${mapaAnomalias[fila][col]})!</b>`);
                        hallazgo = true;
                    }

                    celdaDOM.classList.remove('scanning');
                }
            }

            if (!hallazgo) {
                logTelemetria(`Escaneo completado. Sin anomalías en este cuadrante.`);
            }
        }

        function reiniciarMision() {
            sondaFila = 0;
            sondaCol = 0;
            mapaRevelado = Array(FILAS).fill().map(() => Array(COLS).fill(false));
            mapaRevelado[0][0] = true;
            logTelemetria("Misión reiniciada. Sonda en base [0][0].");
            renderizarMapa();
        }

        // Control por teclado (WASD y Flechas direccionales)
        window.addEventListener('keydown', (e) => {
            switch(e.key.toLowerCase()) {
                case 'w': case 'arrowup': moverSonda(-1, 0); break;
                case 's': case 'arrowdown': moverSonda(1, 0); break;
                case 'a': case 'arrowleft': moverSonda(0, -1); break;
                case 'd': case 'arrowright': moverSonda(0, 1); break;
            }
        });

        // Inicializar misión
        mapaRevelado[0][0] = true;
        renderizarMapa();
    </script>
</body>
</html>
